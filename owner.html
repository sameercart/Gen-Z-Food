<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN Z FOOD — Owner</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header>🍔 GEN Z FOOD — Owner</header><main><section id="login"><h2>Owner login</h2><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="authmsg"></p></section><section id="work" hidden><h2>Create delivery</h2><input id="num" placeholder="Order number (e.g. GZF-1001)"><select id="driver"></select><button onclick="createOrder()">Create & assign order</button><p id="created"></p><h2>Active deliveries</h2><button onclick="refresh()">Refresh</button><div id="orders"></div><div id="map"></div><button onclick="logout()">Logout</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script>
let map,markers={};
async function login(){const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});say('authmsg',error?error.message:'Logged in');if(!error)load()}
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){el('login').hidden=false;el('work').hidden=true;return}const {data:owner}=await db.from('owner_users').select('id').eq('id',user.id).maybeSingle();if(!owner){say('authmsg','This account is not registered as owner.');el('login').hidden=false;el('work').hidden=true;return}el('login').hidden=true;el('work').hidden=false;if(!map){map=L.map('map').setView([29.39,78.67],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map)}const {data:drivers,error}=await db.from('drivers').select('id,name');el('driver').replaceChildren(...(drivers||[]).map(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.name;return o}));if(error)say('created',error.message);refresh()}
async function createOrder(){const number=el('num').value.trim();if(!number)return say('created','Enter order number');const {data,error}=await db.from('delivery_orders').insert({order_number:number,driver_id:el('driver').value,status:'on_the_way'}).select('tracking_token').single();if(error)return say('created',error.message);const url=base+'track.html?token='+encodeURIComponent(data.tracking_token);el('created').replaceChildren(document.createTextNode('Customer tracking link: '));const a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';el('created').append(a);refresh()}
async function refresh(){const {data,error}=await db.from('delivery_orders').select('id,order_number,status,driver_id,tracking_token').in('status',['on_the_way','preparing','pending']).order('created_at',{ascending:false});if(error)return say('orders',error.message);el('orders').replaceChildren();for(const o of data||[]){const div=document.createElement('section');const p=document.createElement('p');p.textContent=o.order_number+' — '+o.status;div.append(p);const a=document.createElement('a');a.href=base+'track.html?token='+o.tracking_token;a.textContent='Customer tracking link';a.target='_blank';div.append(a);const done=document.createElement('button');done.textContent='Mark delivered';done.onclick=async()=>{await db.from('delivery_orders').update({status:'delivered'}).eq('id',o.id);refresh()};div.append(done);el('orders').append(div);if(o.status==='on_the_way'){const {data:l}=await db.from('driver_locations').select('latitude,longitude,updated_at').eq('driver_id',o.driver_id).maybeSingle();if(l&&Date.now()-Date.parse(l.updated_at)<600000){if(!markers[o.id])markers[o.id]=L.marker([l.latitude,l.longitude]).addTo(map);else markers[o.id].setLatLng([l.latitude,l.longitude]);markers[o.id].bindPopup(o.order_number+' — updated '+new Date(l.updated_at).toLocaleTimeString());map.setView([l.latitude,l.longitude],14)}}}}
async function logout(){await db.auth.signOut();load()}
load();setInterval(()=>{if(!el('work').hidden)refresh()},10000);
</script></body></html>
