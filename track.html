<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN Z FOOD — Track Order</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header>🛵 Track your GEN Z FOOD order</header><main><section><h2 id="order">Loading...</h2><p id="status"></p><div id="map"></div><p class="muted">Map updates roughly every 10 seconds while driver has GPS sharing on and the page open. Tracking link is private; don't share it publicly. Tracking expires 48 hours after order creation.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let map=L.map('map').setView([29.39,78.67],12),marker;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
async function refresh(){if(!token||!/^[0-9a-f-]{36}$/i.test(token))return say('order','Invalid tracking link');const {data,error}=await db.rpc('customer_tracking',{p_token:token});if(error)return say('order','Tracking unavailable: '+error.message);const o=data?.[0];if(!o)return say('order','Order not found or tracking expired');say('order','Order '+o.order_number);say('status',o.latitude==null?'Status: '+o.status+' — Waiting for driver location':'Status: '+o.status+' — GPS updated '+new Date(o.updated_at).toLocaleTimeString());if(o.latitude!=null){const pt=[o.latitude,o.longitude];if(!marker)marker=L.marker(pt).addTo(map).bindPopup('Your delivery boy');else marker.setLatLng(pt);map.setView(pt,15)}}refresh();setInterval(refresh,10000);
</script></body></html>
