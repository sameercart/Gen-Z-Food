<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN Z FOOD Driver</title><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}#notice{padding:15px;max-width:650px;margin:auto;color:white;overflow-wrap:anywhere}</style></head><body><header>🛵 GEN Z FOOD — Driver</header><p id="notice">Loading driver panel…</p><main><section id="login"><h2>Delivery boy login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="authmsg"></p></section><section id="work" hidden><h2>My delivery</h2><p id="order">Checking…</p><button id="refreshBtn">Refresh delivery</button><button id="startBtn" disabled>📍 Start live location</button><button id="stopBtn">Stop sharing</button><button id="logoutBtn">Logout</button><p id="gps"></p><p class="muted">Location permission allow karein. Sharing ke liye page khula rakhein.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),say=(id,msg)=>$(id).textContent=msg;let client,watch=null,active=false;$('loginBtn').onclick=login;$('refreshBtn').onclick=load;$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('logoutBtn').onclick=logout;window.addEventListener('error',e=>say('notice','Page error: '+e.message));window.addEventListener('unhandledrejection',e=>say('notice','Error: '+(e.reason?.message||e.reason)));try{if(!window.supabase||typeof db==='undefined')throw Error('Supabase library or config not loaded');client=db;load()}catch(e){say('notice','Setup error: '+e.message)}
async function login(){try{$('loginBtn').disabled=true;say('authmsg','Logging in…');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;say('authmsg','Logged in');await load()}catch(e){say('authmsg','Login error: '+e.message)}finally{$('loginBtn').disabled=false}}
async function load(){try{say('notice','Checking account…');const {data,error}=await client.auth.getUser();if(error)throw error;const user=data?.user;$('login').hidden=!!user;$('work').hidden=!user;if(!user){say('notice','Login karein');return}say('notice','Checking assigned order…');const r=await client.from('delivery_orders').select('order_number,status').eq('driver_id',user.id).eq('status','on_the_way').limit(1);if(r.error)throw r.error;const order=r.data?.[0];say('order',order?'Active order: '+order.order_number:'No active delivery. Owner se driver assignment check karein.');$('startBtn').disabled=!order;say('notice',order?'Active order found':'Logged in, but no active order assigned to this account')}catch(e){say('notice','Error: '+e.message)}}
async function start(){if($('startBtn').disabled)return;if(!navigator.geolocation)return say('gps','GPS unavailable');try{const {data,error}=await client.auth.getUser();if(error||!data?.user)throw Error('Login required');stop();active=true;const id=data.user.id;say('gps','Waiting for GPS…');watch=navigator.geolocation.watchPosition(async p=>{if(!active)return;try{const {error}=await client.from('driver_locations').upsert({driver_id:id,latitude:p.coords.latitude,longitude:p.coords.longitude,updated_at:new Date().toISOString()});say('gps',error?'Update failed: '+error.message:'📍 Location updated '+new Date().toLocaleTimeString())}catch(e){say('gps','Error: '+e.message)}},e=>say('gps','GPS error: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){say('gps',e.message)}}
function stop(){active=false;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;say('gps','Sharing stopped')}async function logout(){try{stop();const {error}=await client.auth.signOut();if(error)throw error;await load()}catch(e){say('notice','Logout error: '+e.message)}}})();
</script></body></html>
